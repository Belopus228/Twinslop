<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="700" fill="#1f2833">Шаг 1. Установка: одно окно терминала</text>

  <!-- выноска 1 над окном -->
  <circle cx="42" cy="70" r="14" fill="#0f7b4f"/>
  <text x="42" y="75" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="66" y="76" font-size="14" fill="#0f7b4f">Вставь команду <tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">./scripts/install-re-tools.sh</tspan> и нажми Enter</text>

  <!-- окно терминала -->
  <rect x="30" y="94" width="840" height="238" rx="12" fill="#1b2430"/>
  <rect x="30" y="94" width="840" height="34" rx="12" fill="#2a3646"/>
  <rect x="30" y="116" width="840" height="12" fill="#2a3646"/>
  <circle cx="52" cy="111" r="6" fill="#ff5f57"/><circle cx="72" cy="111" r="6" fill="#febc2e"/><circle cx="92" cy="111" r="6" fill="#28c840"/>
  <text x="110" y="116" font-size="13" fill="#9fb0c4">Терминал</text>

  <text x="52" y="162" font-size="15" fill="#7ee787" font-family="ui-monospace, Menlo, Consolas, monospace">$ ./scripts/install-re-tools.sh</text>
  <text x="52" y="190" font-size="13" fill="#c9d6e4" font-family="ui-monospace, Menlo, Consolas, monospace">== jadx (dex → Java) ==</text>
  <text x="52" y="212" font-size="13" fill="#8ce99a" font-family="ui-monospace, Menlo, Consolas, monospace">  ok  jadx → /home/you/.local/bin/jadx</text>
  <text x="52" y="234" font-size="13" fill="#c9d6e4" font-family="ui-monospace, Menlo, Consolas, monospace">== apktool (ресурсы + smali) ==</text>
  <text x="52" y="256" font-size="13" fill="#8ce99a" font-family="ui-monospace, Menlo, Consolas, monospace">  ok  apktool → ~/.local/share/apktool/apktool.jar</text>
  <text x="52" y="278" font-size="13" fill="#c9d6e4" font-family="ui-monospace, Menlo, Consolas, monospace">== Android SDK (aapt2, apksigner, adb) ==</text>
  <text x="52" y="300" font-size="13" fill="#c9d6e4" font-family="ui-monospace, Menlo, Consolas, monospace">== проверка установленного ==</text>
  <text x="52" y="322" font-size="13" fill="#8ce99a" font-family="ui-monospace, Menlo, Consolas, monospace">  jadx  apktool  aapt2  adb  frida  dotnet   ok</text>

  <!-- выноска 2 под окном -->
  <circle cx="42" cy="360" r="14" fill="#0f7b4f"/>
  <text x="42" y="365" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="66" y="366" font-size="14" fill="#0f7b4f">Строка «ok» — инструмент уже стоит и работает</text>

  <rect x="30" y="392" width="840" height="58" rx="10" fill="#fff8e6" stroke="#f0d999"/>
  <text x="48" y="416" font-size="13.5" fill="#6b5a20">Скрипт можно запускать сколько угодно раз — он пропускает то, что уже установлено.</text>
  <text x="48" y="438" font-size="13.5" fill="#6b5a20">Проверить, что стоит: ./scripts/install-re-tools.sh --check</text>
</svg>
