name: android-apk

# Собирает APK телефонного контроллера (два стика = две руки).
# В манифесте НЕТ разрешения INTERNET: сетевых проверок в приложении нет,
# вся страница лежит внутри APK (assets/www).

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'web/**'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        run: |
          if ! command -v gradle > /dev/null; then
            curl -sSL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
            sudo ln -sf /opt/gradle-8.7/bin/gradle /usr/local/bin/gradle
          fi
          gradle --version | head -n 6

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME"
          SDKM=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Тесты (игра + разбор APK)
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test

      - name: Уложить веб-часть в assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r web/. android/app/src/main/assets/www/
          find android/app/src/main/assets/www -type f | head -n 40
          du -sh android/app/src/main/assets/www

      - name: Ключ для подписи
        run: |
          if [ ! -f android/keystore.jks ]; then
            keytool -genkeypair -v \
              -keystore android/keystore.jks \
              -storepass twinslop -keypass twinslop \
              -alias twinslop -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Twinslop Hands, O=Twinslop, C=NL"
          fi

      - name: Сборка
        id: assemble
        continue-on-error: true
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASS: twinslop
          KEY_ALIAS: twinslop
          KEY_PASS: twinslop
        run: |
          cd android
          gradle assembleRelease --no-daemon --console=plain > /tmp/build.log 2>&1 || true
          tail -n 60 /tmp/build.log
          if find . -name "*-release.apk" | grep -q .; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Лог сборки в репозиторий (если упало)
        if: steps.assemble.outputs.ok != '1'
        run: |
          mkdir -p build-logs
          cp /tmp/build.log build-logs/android-build.log || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-logs
          git commit -m "ci: лог сборки apk [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
          echo "::error::сборка APK упала, лог в build-logs/android-build.log"
          exit 1

      - name: Проверить APK
        run: |
          APK=$(find android -name "*.apk" | head -n 1)
          echo "== содержимое =="
          unzip -l "$APK" | grep -E "assets/www/(index|game|apk)\.(html|js)" || true
          for f in index.html game.html apk.html apps.html ape.html ape.bundle.js settings.html settings.bundle.js apps.bundle.js apk.bundle.js game.bundle.js docs/reverse-apk.html docs/prosto.html docs/img/1-ustanovka.svg; do
            unzip -l "$APK" | grep -q "assets/www/$f" || { echo "::error::в APK нет assets/www/$f"; exit 1; }
          done
          echo "APK: $APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -E "package:|uses-permission" || true
          if "$AAPT" dump badging "$APK" | grep -q "android.permission.INTERNET"; then
            echo "::error::В APK попало разрешение INTERNET"
            exit 1
          fi
          echo "INTERNET не запрошен — ок"

      - name: Переименовать и загрузить артефакт
        run: |
          APK=$(find android -name "*.apk" | head -n 1)
          cp "$APK" /tmp/TwinslopHands.apk
          ls -lh /tmp/TwinslopHands.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TwinslopHands-apk
          path: /tmp/TwinslopHands.apk
          if-no-files-found: error
          retention-days: 30

      - name: Приложить к релизу
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view hands > /dev/null 2>&1; then
            gh release upload hands /tmp/TwinslopHands.apk --clobber
          else
            gh release create hands /tmp/TwinslopHands.apk \
              --title "Twinslop Hands APK" \
              --notes "Телефонный контроллер: два стика = две руки. Работает полностью офлайн, разрешения INTERNET в манифесте нет." \
              --latest=false
          fi
