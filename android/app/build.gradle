plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.arena.twinslop'
    compileSdk 34

    defaultConfig {
        applicationId 'ai.arena.twinslop'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile rootProject.file(System.getenv('KEYSTORE_PATH') ?: 'keystore.jks')
            storePassword System.getenv('KEYSTORE_PASS') ?: 'twinslop'
            keyAlias System.getenv('KEY_ALIAS') ?: 'twinslop'
            keyPassword System.getenv('KEY_PASS') ?: 'twinslop'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}
