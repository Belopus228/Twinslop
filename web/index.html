<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#070b14" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Twinslop Hands — два стика</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="app" id="app">

  <header class="hud">
    <div class="brand">
      <span class="led" id="led"></span>
      <span class="brand-name">TWINSLOP</span><span class="brand-sub">HANDS</span>
    </div>

    <div class="readout">
      <span class="tag tag-l">L <b id="valL">0.00 · 0.00</b></span>
      <span class="tag tag-r">R <b id="valR">0.00 · 0.00</b></span>
    </div>

    <div class="hud-actions">
      <a class="ghost" href="./game.html" aria-label="Играть">▶</a>
      <a class="ghost" href="./apk.html" aria-label="Разбор APK">📦</a>
      <button class="ghost" id="btnFull" aria-label="На весь экран">⛶</button>
      <button class="ghost" id="btnSettings" aria-label="Настройки">⚙</button>
    </div>
  </header>

  <main class="stage">
    <canvas id="view"></canvas>
    <div class="hint" id="hint">держи телефон двумя руками · большие пальцы — на стики</div>
  </main>

  <div class="controls">
    <section class="side side-l">
      <div class="abtns">
        <button class="abtn" data-hand="L" data-btn="trigger"><span>TRIG</span></button>
        <button class="abtn" data-hand="L" data-btn="grip"><span>GRIP</span></button>
      </div>
      <div class="pad" id="padL" data-hand="L">
        <div class="pad-ring"></div>
        <div class="pad-cross"><i></i><i></i></div>
        <div class="pad-thumb"><span>L</span></div>
      </div>
    </section>

    <section class="side side-r">
      <div class="abtns">
        <button class="abtn" data-hand="R" data-btn="trigger"><span>TRIG</span></button>
        <button class="abtn" data-hand="R" data-btn="grip"><span>GRIP</span></button>
      </div>
      <div class="pad" id="padR" data-hand="R">
        <div class="pad-ring"></div>
        <div class="pad-cross"><i></i><i></i></div>
        <div class="pad-thumb"><span>R</span></div>
      </div>
    </section>
  </div>
</div>

<!-- настройки -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-card">
    <h2>Настройки</h2>

    <label class="row">
      <span>Чувствительность <b id="lblSens">1.0×</b></span>
      <input type="range" id="sens" min="0.4" max="2.6" step="0.1" value="1.3" />
    </label>

    <label class="row">
      <span>Мёртвая зона <b id="lblDead">0.06</b></span>
      <input type="range" id="dead" min="0" max="0.4" step="0.01" value="0.06" />
    </label>

    <label class="row switch">
      <span>Вибрация при нажатиях</span>
      <input type="checkbox" id="vib" checked />
    </label>

    <label class="row switch">
      <span>Инвертировать вертикаль</span>
      <input type="checkbox" id="inv" />
    </label>

    <label class="row switch">
      <span>Держать экран включённым</span>
      <input type="checkbox" id="wake" checked />
    </label>

    <div class="sheet-note" id="netNote">состояние связи: —</div>
    <button class="primary" id="btnClose">Готово</button>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
