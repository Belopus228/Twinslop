<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#070a12" />
<title>APE HEIST — Twinslop</title>
<link rel="stylesheet" href="./ape.css" />
</head>
<body class="ape">

<canvas id="apeCanvas"></canvas>

<!-- ---------------- HUD ---------------- -->
<div class="hud-top">
  <a class="chip back" href="./index.html" aria-label="Назад">←</a>

  <div class="chip loot gold"><span class="dot"></span><b id="hudGold">0</b></div>
  <div class="chip loot gem"><span class="dot"></span><b id="hudGems">0</b></div>
  <div class="chip timer" id="hudTimer">3:00</div>

  <button class="chip mode on" data-mode="heist">Ограбление</button>
  <button class="chip mode" data-mode="hide">Продержись</button>
  <button class="chip" id="hudRestart" aria-label="Заново">↻</button>
</div>

<div class="hud-left">
  <div class="monster-line">
    <span class="monster-dot" id="monsterState" data-level="patrol">обходит</span>
  </div>
  <div class="noise">
    <div class="noise-label">ШУМ</div>
    <div class="noise-bar"><div class="noise-fill" id="noiseFill" data-level="low"></div></div>
  </div>
  <div class="hands">
    <span class="hand" id="handL">L</span>
    <span class="hand" id="handR">R</span>
  </div>
  <div class="goal" id="goalText">собери 3 и уходи к зелёному кругу</div>
</div>

<!-- ---------------- стики ---------------- -->
<div class="stick" id="stickL"><div class="stick-knob" id="knobL"></div></div>
<div class="stick" id="stickR"><div class="stick-knob" id="knobR"></div></div>

<!-- ---------------- баннер ---------------- -->
<div class="banner" id="banner" hidden>
  <h2 id="bannerTitle">ГОТОВО</h2>
  <p id="bannerText"></p>
  <div class="banner-actions">
    <button class="primary" id="bannerRestart">Ещё раз</button>
    <a class="ghost" href="./index.html">В меню</a>
  </div>
</div>

<div class="hint" id="hint">
  <b>Два стика — две руки.</b> Тяни стик к опоре — рука цепляется и подтягивает.
  Быстро двигаешься — шумишь, монстр слышит. Свайп по экрану — поворот камеры.
  На клавиатуре: WASD — левая рука, стрелки — правая.
  <button class="hint-close" id="hintClose">Понятно</button>
</div>

<script src="./ape.bundle.js"></script>
</body>
</html>
